<svg width="1280" height="880" viewBox="0 0 1280 880" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="880" rx="28" fill="#F8FAFC"/>
  <text x="84" y="92" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">Agentic Research Workflow Architecture</text>
  <text x="84" y="132" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">Deterministic offline mode, tool orchestration, retrieval fallback, and benchmarkable execution.</text>

  <rect x="108" y="184" width="1064" height="76" rx="18" fill="#DBEAFE" stroke="#60A5FA"/>
  <text x="492" y="231" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">CLI / Benchmark Runner</text>

  <path d="M640 260V308" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>

  <rect x="310" y="308" width="660" height="92" rx="22" fill="#0F172A"/>
  <text x="522" y="362" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">ResearchAgent Core</text>

  <path d="M640 400V454" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>

  <rect x="92" y="454" width="246" height="160" rx="22" fill="#E0F2FE" stroke="#38BDF8"/>
  <text x="174" y="500" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Planner</text>
  <text x="126" y="540" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="20">Breaks query into sub-tasks</text>
  <text x="126" y="570" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="20">Selects tool sequence</text>

  <rect x="366" y="454" width="246" height="160" rx="22" fill="#DCFCE7" stroke="#22C55E"/>
  <text x="444" y="500" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Executor</text>
  <text x="396" y="540" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="20">Runs retrieval and analysis tools</text>
  <text x="396" y="570" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="20">Resolves task dependencies</text>

  <rect x="640" y="454" width="246" height="160" rx="22" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="716" y="500" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Analyzer</text>
  <text x="670" y="540" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="20">Scores quality and completeness</text>
  <text x="670" y="570" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="20">Triggers finish or replan</text>

  <rect x="914" y="454" width="246" height="160" rx="22" fill="#EDE9FE" stroke="#8B5CF6"/>
  <text x="968" y="500" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Context</text>
  <text x="944" y="540" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="20">Stores plan, trace, and insights</text>
  <text x="944" y="570" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="20">Supports iterative execution</text>

  <path d="M489 614V688" stroke="#16A34A" stroke-width="6" stroke-linecap="round"/>
  <path d="M763 614V688" stroke="#D97706" stroke-width="6" stroke-linecap="round"/>

  <rect x="194" y="688" width="426" height="122" rx="22" fill="#0F172A"/>
  <text x="242" y="734" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Tool Layer</text>
  <text x="242" y="772" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="21">hybrid_retrieval, paper_search, x_search,</text>
  <text x="242" y="800" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="21">sentiment_analysis, citation_tracker</text>

  <rect x="658" y="688" width="428" height="122" rx="22" fill="#0F172A"/>
  <text x="706" y="734" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Runtime Modes</text>
  <text x="706" y="772" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="21">Live Grok client or deterministic offline client</text>
  <text x="706" y="800" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="21">Keyword-only fallback when embeddings are disabled</text>
</svg>
