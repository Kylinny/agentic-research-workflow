  <text x="116" y="398" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="22">The offline workflow aligned local social-discourse retrieval with academic paper search</text>
  <text x="116" y="428" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="22">to produce a reproducible research brief without requiring live model credentials.</text>

