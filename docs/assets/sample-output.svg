  <text x="132" y="532" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="22">• Public discourse emphasized commercialization, risk perception, and hype cycles.</text>
  <text x="132" y="566" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="22">• Paper retrieval surfaced methodology-heavy discussions and citation-linked evidence.</text>
